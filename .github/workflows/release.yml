name: Release

# Runs when a tag like 2026.11.1 (YYYY.MM.release) is pushed, or by hand with the
# tag to create on the chosen branch or commit.
on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (YYYY.MM.release, e.g. 2026.11.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^20[0-9]{2}\.(0[1-9]|1[0-2])\.[1-9][0-9]*$'; then
            echo "::error::'$TAG' is not YYYY.MM.release (for example 2026.11.1)"; exit 1
          fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::a release named $TAG already exists"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::the tag $TAG already exists; push-triggered runs release existing tags"; exit 1
          fi
      - name: Vendored code unchanged
        run: scripts/verify_vendor.sh
      - name: Build, test and check symbols
        run: AUDREY_RELEASE_VERSION="$TAG" scripts/build_device.sh --out "$RUNNER_TEMP/device-build"
      - name: Package
        run: scripts/package_port.sh --from "$RUNNER_TEMP/device-build" --out "$RUNNER_TEMP/dist"
      - name: Create the release
        run: |
          cd "$RUNNER_TEMP/dist"
          ls -l
          test -f "AudreyBrick-$TAG.zip"
          gh release create "$TAG" "AudreyBrick-$TAG.zip" "AudreyBrick-$TAG.sha256" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "AudreyBrick $TAG" --generate-notes
